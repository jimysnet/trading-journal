name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          for u in https://fapi.binance.com/fapi/v1/ping https://api.binance.com/api/v3/ping https://data-api.binance.vision/api/v3/ping https://www.okx.com/api/v5/public/time https://api.bybit.com/v5/market/time; do echo "$u $(curl -s -m 8 -o /dev/null -w '%{http_code}' $u)"; done
          node -e "const W=globalThis.WebSocket;if(!W){console.log('no ws');process.exit(0)}const w=new W('wss://fstream.binance.com/market/stream?streams=btcusdt@aggTrade');let n=0;w.onmessage=()=>{n++};w.onerror=e=>console.log('ws error');setTimeout(()=>{console.log('ws msgs',n);process.exit(0)},6000)"
