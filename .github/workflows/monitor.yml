# 🫀 Παρακολούθηση του Καθηγητή κάθε 30′ (μόνο ανάγνωση). Αν κάτι δεν πάει καλά, η εκτέλεση αποτυγχάνει και το GitHub στέλνει email.
name: monitor
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Έλεγχος
        working-directory: runner
        env:
          TJ_URL: ${{ secrets.TJ_URL }}
          TJ_BOT_EMAIL: ${{ secrets.TJ_BOT_EMAIL }}
          TJ_BOT_PASSWORD: ${{ secrets.TJ_BOT_PASSWORD }}
        run: node monitor.mjs
