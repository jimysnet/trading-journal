# 🤖 Ο «φύλακας»: κρατά τη σελίδα ανοιχτή 24/7 (βάρδιες ~5,8 ωρών).
# Το GitHub καθυστερεί ή και «χάνει» προγραμματισμένες εκτελέσεις, γι' αυτό: κάθε βάρδια ξεκινά μόνη της την επόμενη, και ζητάμε βάρδια και κάθε 30′:
# όσο τρέχει μία, η επόμενη περιμένει στη σειρά (concurrency) και ξεκινά μόλις τελειώσει η προηγούμενη.
# ώστε τα αυτόματα demo (Αυτόματος, Turtle, έλεγχοι SL/TP) να τρέχουν χωρίς να ανοίγει κανείς σελίδα.
# Χρειάζεται στα Settings → Secrets and variables → Actions του repo:
#   TJ_URL           π.χ. https://trading-journal.vercel.app
#   TJ_BOT_EMAIL     email του λογαριασμού bot στο Firebase
#   TJ_BOT_PASSWORD  κωδικός του bot
name: runner
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Εγκατάσταση
        working-directory: runner
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      # Μνήμη από βάρδια σε βάρδια: το προφίλ του browser (δεδομένα Firebase + σύνδεση) αποθηκεύεται κρυπτογραφημένο
      # (το repo είναι δημόσιο), και η επόμενη βάρδια ξεκινά από εκεί αντί να κατεβάζει τα πάντα ξανά.
      - name: Μνήμη φύλακα (επαναφορά)
        uses: actions/cache/restore@v4
        with:
          path: runner/profile.enc
          key: tj-profile-${{ github.run_id }}
          restore-keys: tj-profile-
      - name: Μνήμη φύλακα (άνοιγμα)
        working-directory: runner
        env:
          K: ${{ secrets.TJ_BOT_PASSWORD }}
        run: |
          if [ -f profile.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in profile.enc | tar xz && echo "μνήμη: $(du -sh .profile | cut -f1)" || { echo "η μνήμη δεν άνοιξε, ξεκινά καινούρια"; rm -rf .profile; }
            rm -f profile.enc
          else echo "δεν υπάρχει αποθηκευμένη μνήμη"; fi
      - name: Βάρδια
        working-directory: runner
        env:
          TJ_PROFILE: .profile
          TJ_URL: ${{ secrets.TJ_URL }}
          TJ_BOT_EMAIL: ${{ secrets.TJ_BOT_EMAIL }}
          TJ_BOT_PASSWORD: ${{ secrets.TJ_BOT_PASSWORD }}
          RUN_MINUTES: '350'
        run: node run.mjs
      - name: Μνήμη φύλακα (κλείδωμα)
        if: always()
        working-directory: runner
        env:
          K: ${{ secrets.TJ_BOT_PASSWORD }}
        run: |
          if [ -d .profile/Default ]; then
            rm -rf .profile/Default/Cache .profile/Default/"Code Cache" .profile/Default/GPUCache .profile/Default/"Service Worker"/CacheStorage .profile/GrShaderCache .profile/ShaderCache
            tar czf - .profile | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:K -out profile.enc
            echo "μνήμη: $(du -sh .profile | cut -f1) → κρυπτογραφημένη $(du -sh profile.enc | cut -f1)"
          fi
      - name: Μνήμη φύλακα (αποθήκευση)
        if: always() && hashFiles('runner/profile.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: runner/profile.enc
          key: tj-profile-${{ github.run_id }}
      # Το GitHub «χάνει» συχνά τις προγραμματισμένες εκτελέσεις (π.χ. 5 ώρες κενό τη νύχτα).
      # Γι' αυτό κάθε βάρδια, μόλις τελειώσει, ζητά μόνη της την επόμενη: η αλυσίδα δεν σπάει ποτέ.
      - name: Επόμενη βάρδια
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run runner.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || \
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/runner.yml/dispatches" -d '{"ref":"${{ github.ref_name }}"}'
